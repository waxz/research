# Sim-to-real: the reality gap in reinforcement learning

*An analysis of why policies trained in simulation fail on real robots, and of what works to fix them: system identification, actuator and contact modelling, domain randomization, adaptation, residual and learned models, real-to-sim reconstruction. It covers the latest achievements and trends, in the same format as the other collections in this repository. Equations are derived in the companion [cookbook](cookbook/COOKBOOK.md) (recipes G1–G19), and every source is in the [catalog](CATALOG.md). A critical review of recent learned and differentiable actuator and contact models is in [reports/01](reports/01-learned-actuator-contact-models.md). Quoted results come from the papers' own abstracts, checked on 1 Nov 2026.*

## Summary

- **The gap is mostly in the parts simulators simplify most: actuators and contact.**
  - Simulators often treat motors as ideal torque sources with no delay. Real actuators have torque–speed limits, friction, backlash and latency. In this collection's examples, a 10 ms delay turns a stable joint loop unstable, and 1 Nm of Coulomb friction leaves a 0.02 rad dead band (G1–G3).
  - Contact is modelled with soft penalties, complementarity problems or convex approximations. All are fitted guesses: on real impact data, simulators capture inelastic impacts but fail on elastic ones (Acosta et al.), and rigid-body contact models have fundamental accuracy limits (Fazeli et al.).
- **Successful systems combine three moves:**
  1. **Make the simulator more real**: system identification, learned actuator models (Hwangbo et al. 2019), latency simulation (Tan et al. 2018), residual corrections learned from real data (Swift 2023, ASAP 2025).
  2. **Make the policy robust**: domain randomization of visuals (Tobin et al. 2017) and dynamics (Peng et al. 2018), automatic randomization (OpenAI 2019), perturbations.
  3. **Make the policy adaptive**: privileged teacher → history-based student (Lee et al. 2020), rapid motor adaptation (RMA 2021), online system identification.
- **Randomization has a cost.** Ranges that are too wide make the policy conservative; ranges that are too narrow leave the real robot outside them (G10–G11). The trend since 2019 has been to *fit* the randomization to real data (SimOpt, BayesSim, BayRn, DROPO) or to grow it automatically (ADR), rather than guess it.
- **Latest achievements (2023–2026):**
  - zero-shot humanoid soccer (DeepMind, 2024): walked 181% faster than a scripted baseline;
  - champion-level drone racing (Swift, 2023);
  - humanoid whole-body tracking (BeyondMimic, SONIC, SuperMimic);
  - ANYmal parkour;
  - dexterous in-hand reorientation from a single depth camera.
- **Trends.**
  - GPU-parallel simulators make training take minutes to hours (Isaac Gym/Lab, MuJoCo Playground/Warp, Genesis).
  - Delta-action and learned world models correct the simulator from real data.
  - Real-to-sim pipelines build digital twins and photorealistic Gaussian-splat scenes (RialTo: over 67% robustness gain; SplatSim: 86% zero-shot success vs 97.5% with real data).
  - Foundation models generate tasks and scenes (RoboGen).
  - Researchers test sim-to-sim first, measuring whether simulation predicts reality at all: the sim-vs-real correlation was only 0.18 in Habitat's 2019 navigation challenge setup.

---

## 1. What the gap is

A policy $\pi$ is trained to maximize return under simulated dynamics $P_{\text{sim}}(s'\mid s,a;\xi)$ and observations $O_{\text{sim}}$. It is deployed under $P_{\text{real}}$ and $O_{\text{real}}$. The gap is everything that differs. RL makes it worse, because an optimizer **exploits** any simulator flaw that pays: sliding along walls in navigation (Kadian et al.), contact artefacts in locomotion and manipulation.

| Source | What simulators usually assume | What reality does | Typical effect | Cookbook |
|---|---|---|---|---|
| **Actuator torque limits** | Constant torque limit, or none | Available torque falls with speed (back-EMF); current and thermal limits | Fast motions fail or saturate | G1 |
| **Latency** | Zero or one-step delay | Sensor, compute, bus and driver delays of ~5–40 ms | Overshoot, oscillation, instability | G2 |
| **Friction, backlash, compliance** | Ideal joints | Coulomb and viscous friction, stiction, gear backlash, belt and harmonic-drive compliance | Dead bands, limit cycles, poor small motions | G3 |
| **Low-level control** | Exact PD at sim rate | PD loop in the motor driver at its own rate and gains | Different effective stiffness and damping | G4 |
| **Mass and inertia** | CAD values | Cables, batteries, payloads, manufacturing variation | Biased dynamics | G8 |
| **Contact** | Rigid or soft contact with one friction coefficient | Compliant feet and ground, anisotropic friction, impacts, deformable terrain | Slipping, bouncing, wrong impact response | G5–G7 |
| **Sensors** | Noise-free or Gaussian | Bias, drift, dropouts, rolling shutter, exposure, reflections | State-estimation errors | SLAM cookbook S2, S18 |
| **Rendering** | Synthetic textures and lighting | Real lighting, materials, clutter | Vision policies fail | (Tobin 2017, SplatSim) |
| **Numerics** | Large time step, few solver iterations | Continuous physics | Penetration, energy gain, jitter | G16 |
| **Environment** | Flat ground, known objects | Terrain, unknown objects, people | Out-of-distribution states | G10–G12 |

## 2. Contact: how simulators model it, and where it breaks

| Formulation | Idea | Pros | Cons | Used by |
|---|---|---|---|---|
| **Penalty (spring-damper)** | Force $f_n=k\,\delta+c\,\dot\delta$ for penetration $\delta$ | Simple, smooth | Stiff: needs small time steps; tuning $k,c$ | Many game engines, early simulators |
| **Complementarity (LCP/NCP)** | $0\le\lambda_n\perp\phi\ge0$, friction cone, solved per time step (Stewart & Trinkle 1996) | Hard contact, physically principled | Non-convex with exact friction; solver cost; non-unique solutions | ODE, Bullet, Drake (variants) |
| **Convex soft contact** | Relax complementarity into a convex optimization (Todorov 2014) | Unique, fast, smooth, invertible; good for optimization | Small "soft" penetration and forces at a distance; parameters such as `solref` and `solimp` to tune | MuJoCo, MJX, MuJoCo Warp |
| **Per-contact iteration** | Solve each contact exactly in turn (Hwangbo et al. 2018) | Hard contact, accurate friction cones | Iterative convergence | RaiSim |
| **GPU solvers** | Iterative Gauss–Seidel-type solvers (projected or temporal Gauss–Seidel) for massive parallelism | Thousands of environments per GPU | Accuracy vs speed trade-offs | Isaac Gym/Sim/Lab (PhysX) |

**Evidence that contact is the weak point.**
- **Fazeli et al. (2017)** identified six common planar rigid-body contact models on real impact data. They found task-specific upper bounds on accuracy, and parameters that are hard to interpret physically.
- **Acosta et al. (2022)** compared Drake, MuJoCo and Bullet against real data. For a cube tossed on a table they "capture inelastic impacts well while failing to capture elastic impacts". For a Cassie biped landing from a jump, accuracy is limited by "numerous model differences between the real robot and the simulators".
- **Horak & Trinkle (2019)** show that different formulations make different physical assumptions, so the same scene behaves differently across simulators.
- **Friction cones** are often linearized into pyramids, which under- or over-estimate tangential force by up to about 30–40% in some directions (G6).

## 3. Actuators: the most underestimated part of the gap

| Model level | What it captures | Used in |
|---|---|---|
| Ideal torque source | Nothing beyond a limit | Most default environments |
| PD + torque limit + delay | Driver gains, saturation, latency | legged_gym-style setups; Tan et al. 2018 (latency) |
| DC motor + gearbox model | Torque–speed curve ($\tau_{\max}$ falls with speed), friction, efficiency, backlash | Tan et al. 2018 (actuator model for Minitaur) |
| **Learned actuator network** | Everything above, plus unmodelled effects, learned from real (command, error, velocity) histories | Hwangbo et al. 2019 (ANYmal series-elastic actuators) |
| **Residual / delta action** | Whatever the simulator gets wrong, at the level of actions | ASAP 2025 (Unitree G1) |
| Hardware designed for transfer | Low-gear-ratio, high-bandwidth "proprioceptive" actuators are transparent and easier to model | MIT Cheetah (Wensing et al. 2017) |

In the cookbook's example (G4), a "torque = command" model has 3.8 Nm RMS error on held-out data from an actuator with delay, saturation and friction. A model learned from command history reduces that to 1.3 Nm. This is the core idea of Hwangbo et al.'s actuator network.

## 4. Strategy families compared

| Family | Idea | Examples | Needs | Strengths | Costs and risks |
|---|---|---|---|---|---|
| **System identification** | Fit simulator parameters (mass, friction, gains, delays) to real data | Classical least-squares or Bayesian ID (G8–G9); Tan 2018 | Exciting experiments on the robot | Physically meaningful; improves everything downstream | Only fits what the model can express; poor excitation gives nonsense (G8) |
| **Learned actuator / residual dynamics** | Learn the part physics gets wrong | Actuator net (Hwangbo 2019); Swift's residual models; ASAP delta action (G14); RWM | Real logs | Captures unmodelled effects; targeted | Extrapolation outside the data; another model to maintain |
| **Domain randomization** | Train over a distribution $p(\xi)$ so reality looks like one more sample | Visual (Tobin 2017, CAD2RL), dynamics (Peng 2018), Dactyl | Sensible ranges | Simple; no real data required | Too wide → conservative; too narrow → miss (G10–G11) |
| **Adaptive / automatic randomization** | Learn or grow $p(\xi)$ | ADR (OpenAI 2019, G12); SimOpt; BayesSim; BayRn; DROPO | Success signals or a few real rollouts | Ranges fitted to reality | More machinery; still bounded by the simulator's expressiveness |
| **Adaptation from history** | Infer the environment from recent observations and actions | UP-OSI (Yu 2017); teacher–student (Lee 2020); RMA (Kumar 2021); transformer in-context adaptation (Radosavovic 2024) | Randomized training | Adapts online in fractions of a second | Can only adapt within the training distribution |
| **Robust / adversarial training** | Optimize against perturbations or an adversary | RARL (Pinto 2017); push perturbations (soccer 2024) | Perturbation models | Robust to forces and disturbances | Can be over-conservative |
| **Real-world fine-tuning** | Finish learning on hardware | SERL (Luo 2024) | Safe resets, reward measurement | Closes residual gap directly | Time, wear, safety |
| **Real-to-sim** | Reconstruct the real scene as a simulator | RialTo (digital twins, over 67% robustness gain); SplatSim (Gaussian splats, 86.25% zero-shot) | Scanning, calibration | Matches visuals and geometry | Physics of scanned objects still uncertain |
| **Design around the gap** | Choose control rates, observations and hardware that transfer | High-frequency control (soccer 2024); compact observations (Tan 2018); proprioceptive actuators | Engineering judgement | Prevents problems rather than patching them | Requires hardware and system co-design |

## 5. Close the gap, or design around it?

The RSS 2020 workshop (Höfer et al.) framed the field's central debate: make the simulator match reality, or make policies that don't care. The evidence since says **both, in a specific order**:
1. **Fix systematic errors first**: latency, actuator limits, mass, PD gains. Randomization can't cover an error the policy never sees in training.
2. **Randomize the residual uncertainty**, with ranges fitted to real measurements (G9) or grown automatically (G12).
3. **Give the policy memory or an adaptation module**, so it can identify where in the range reality lies (G13).
4. **Correct what remains** with residual or delta models learned from real data (G14), and fine-tune if it's safe to.

DeepMind's soccer study (Haarnoja et al. 2024) attributes its zero-shot transfer to exactly this kind of combination: "sufficiently high-frequency control, targeted dynamics randomization, and perturbations during training".

## 6. Measuring the gap

- **Sim-vs-real correlation (SRCC).** Rank several policies in simulation and in reality, then correlate the two. Kadian et al. found 0.18 for Habitat success in the CVPR19 challenge setup, because agents exploited collision sliding. Tuning the simulator raised it substantially (G15).
- **Sim-to-sim transfer as a proxy.** Train in one simulator and test in another before touching hardware. ASAP evaluates IsaacGym → IsaacSim, IsaacGym → Genesis and IsaacGym → the real G1.
- **Trajectory replay.** Replay real command logs in simulation and compare joint trajectories, contact timing and foot slip. This is the basis of system identification and residual models (G8, G14).
- **Report the rate,** not just a video: success over N trials, falls, and the conditions excluded.

## 9. Latest trends

1. **Simulation at GPU scale.** Isaac Gym/Lab, MJX and MuJoCo Playground, MuJoCo Warp and Genesis make randomizing over thousands of environments cheap. MuJoCo Playground reports training "in minutes on a single GPU" with zero-shot transfer for quadrupeds, humanoids, hands and arms.
2. **From guessing ranges to fitting them.** Bayesian and likelihood-free inference of simulator parameters (BayesSim, DROPO, BayRn) and ADR replace hand-chosen uniform ranges.
3. **Learned corrections on top of physics.** Actuator networks, residual dynamics (Swift), delta actions (ASAP) and full neural simulators (RWM, and the world model in SuperMimic) learn from real or simulator logs.
4. **Real-to-sim reconstruction.** Phone or scanner captures become digital twins (RialTo) or Gaussian-splat renderers (SplatSim), shrinking the visual gap for camera policies.
5. **Generative simulation.** Foundation models propose tasks, assets and rewards (RoboGen), scaling the diversity of training environments.
6. **Adaptation by memory.** Transformer and recurrent policies adapt in context (Radosavovic 2024) instead of through explicit parameter estimates.
7. **Evaluation discipline.** Sim-to-sim checks, sim-vs-real correlation and trajectory replay are becoming standard before hardware runs.
8. **Learned and differentiable actuator and contact models.** Encoder-only actuator identification through MJX, diffusion-posterior calibration with residual models, large public proprioceptive logs, and agent-assisted real-to-sim. Contact laws remain unidentified and validation is thin. See the critical review in [reports/01](reports/01-learned-actuator-contact-models.md) and recipes G17–G19.

## 10. A practical checklist

1. **Measure** latency end to end, PD gains, torque limits and the torque–speed curve. Model them, or randomize around measured values.
2. **Identify** masses, inertias, friction and armature with exciting trajectories (G8). Check the regressor's conditioning.
3. **Replay** real logs in simulation and compare; fix systematic errors before adding randomization.
4. **Randomize** what remains, with ranges from measurements (G9). Add sensor noise, delays and push perturbations.
5. **Give the policy history** (or train a teacher–student pair) so it can adapt within the range (G13).
6. **Test sim-to-sim**, then on hardware with a safety harness; track success rates and SRCC across policy versions.
7. **Close the residual** with delta-action or residual models from real data (G14), or fine-tune on hardware if safe.
